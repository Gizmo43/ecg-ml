 [project]
name = "ecg-ml"
version = "0.0.1"
requires-python = ">=3.12,<3.14"
dependencies = [
    # --------- pytorch --------- #
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "torchmetrics>=0.11.4",

    # --------- hydra --------- #
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "hydra-optuna-sweeper==1.2.0",

    # --------- loggers --------- #
    "mlflow-skinny",

    # --------- others --------- #
    "scikit-learn>=1.6.0", # machine learning utils
    "rootutils",           # standardizing the project root setup
    "rich",                # beautiful text formatting in terminal
    "seaborn",             # plotting tool
]

[dependency-groups]
dev = [
    "pre-commit", # hooks for applying linters on commit
    "ipykernel",  # Jupyter kernel for notebooks/
    "ipywidgets", # progress bars in Jupyter
]

# global commands available in the terminal after installing the package
[project.scripts]
train_command = "ecg_ml.train:main"
eval_command = "ecg_ml.eval:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ecg_ml*"]
